<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title data-i18n="page.title">Quinoa — Order online</title>
<meta name="description" data-i18n-content="page.description" content="Order your favourite Quinoa dishes and pay by card from your phone." />
<meta name="theme-color" content="#3f6b4a" />

<!-- PWA -->
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon-192.png" />

<!-- Instalación en iPhone / iPhone home screen install -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Quinoa" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />

<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-leaf">🌱</span>
    <span id="business-name">Quinoa</span>
  </div>

  <div class="topbar-right">
    <!-- Pestañas de idioma / Language tabs -->
    <div class="lang-tabs" role="tablist" aria-label="Language">
      <button class="lang-tab" role="tab" data-lang="en" aria-selected="true">English</button>
      <button class="lang-tab" role="tab" data-lang="es" aria-selected="false">Español</button>
    </div>

    <button id="cart-button" class="cart-button" data-i18n-aria="nav.cart" aria-label="View cart">
      🛒 <span id="cart-count" class="cart-count">0</span>
    </button>
  </div>
</header>

<div id="offline-banner" class="offline-banner" data-i18n="banner.offline" hidden>You're offline — some features may not be available.</div>
<div id="payments-warning" class="payments-warning" data-i18n="banner.paymentsOff" hidden>
  Card payments haven't been switched on by the restaurant yet.
</div>

<main id="menu-root" class="menu-root">
  <p class="loading" data-i18n="menu.loading">Loading menu…</p>
</main>

<!-- Carrito / Cart -->
<aside id="cart-drawer" class="cart-drawer" aria-hidden="true">
  <div class="cart-drawer-header">
    <h2 data-i18n="cart.title">Your order</h2>
    <button id="close-cart" class="icon-button" data-i18n-aria="cart.close" aria-label="Close cart">✕</button>
  </div>
  <div id="cart-items" class="cart-items"></div>

  <form id="customer-form" class="customer-form">
    <label>
      <span data-i18n="form.name">Full name</span>
      <input type="text" name="name" required autocomplete="name" />
    </label>
    <label>
      <span data-i18n="form.phone">Phone</span>
      <input type="tel" name="phone" required autocomplete="tel" />
    </label>
    <label>
      <span data-i18n="form.email">Email (optional, for your receipt)</span>
      <input type="email" name="email" autocomplete="email" />
    </label>

    <div class="order-type-toggle">
      <label class="radio-pill">
        <input type="radio" name="orderType" value="pickup" checked />
        <span data-i18n="form.pickup">Pick up in store</span>
      </label>
      <label class="radio-pill">
        <input type="radio" name="orderType" value="delivery" />
        <span data-i18n="form.delivery">Delivery</span>
      </label>
    </div>

    <label id="address-field" hidden>
      <span data-i18n="form.address">Delivery address</span>
      <textarea name="address" rows="2"></textarea>
    </label>

    <label>
      <span data-i18n="form.notes">Order notes (optional)</span>
      <textarea name="notes" rows="2" data-i18n-placeholder="form.notesPlaceholder" placeholder="E.g. no onion, ring the doorbell, etc."></textarea>
    </label>
  </form>

  <div class="cart-summary">
    <div class="cart-line"><span data-i18n="cart.subtotal">Subtotal</span><span id="cart-subtotal">$0.00</span></div>
    <div class="cart-line" id="cart-delivery-line" hidden><span data-i18n="cart.delivery">Delivery</span><span id="cart-delivery">$0.00</span></div>
    <div class="cart-line cart-total"><span data-i18n="cart.total">Total</span><span id="cart-total">$0.00</span></div>
  </div>

  <p id="checkout-error" class="checkout-error" hidden></p>

  <button id="checkout-button" class="checkout-button" data-i18n="checkout.pay" disabled>
    Pay by card 💳
  </button>
</aside>
<div id="cart-overlay" class="cart-overlay" hidden></div>

<footer class="footer">
  <p data-i18n="footer.note">Payments are securely processed by Stripe. Quinoa never stores your card details.</p>
</footer>

<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
